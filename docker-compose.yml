services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5532:5432"
    environment:
      POSTGRES_USER: mrhao
      POSTGRES_PASSWORD: Tuvy3108!@#26
      POSTGRES_DB: maindb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrhao -d maindb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
